<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MOTH &amp; KEY — a stealth game in three nights</title>
    <meta
      name="description"
      content="MOTH & KEY: a small top-down stealth game in three nights. Take the keycard, read the torches, and reach the green door unseen."
    />
    <link
      rel="icon"
      href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII="
    />
    <style>
      :root {
        color-scheme: dark;
        background: #05080f;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background:
          radial-gradient(ellipse at 50% 42%, #0d1626 0%, #05080f 62%, #02040a 100%);
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      }
      #stage {
        display: block;
        width: min(100vw, calc(100vh * 16 / 9));
        height: auto;
        aspect-ratio: 16 / 9;
        background: #05080f;
        border-radius: 3px;
        box-shadow:
          0 0 0 1px rgba(201, 160, 99, 0.18),
          0 30px 90px rgba(0, 0, 0, 0.72);
        cursor: crosshair;
        touch-action: none;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <canvas id="stage" width="1280" height="720" aria-label="MOTH & KEY, a top-down stealth game">
      MOTH &amp; KEY runs on a canvas. Please use a current desktop browser.
    </canvas>
    <p id="status" class="sr-only" role="status" aria-live="polite">MOTH &amp; KEY.</p>
    <noscript>MOTH &amp; KEY needs JavaScript, but it makes no network requests once the page has loaded.</noscript>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
